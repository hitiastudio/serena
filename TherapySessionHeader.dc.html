<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:8px;width:100%">
  <span style="font-size:14px;font-weight:600;color:#2A374C;line-height:1.3;text-wrap:pretty">{{ stepLabel }}</span>
  <div style="display:flex;align-items:center;gap:12px">
    <div role="group" aria-label="Progreso de la sesión" style="flex:1 1 0;min-width:0;display:flex;gap:5px;align-items:center">
      <sc-for list="{{ bars }}" as="sb" hint-placeholder-count="5">
        <span role="img" aria-label="{{ sb.aria }}" style="flex:1 1 0;height:6px;border-radius:999px;background:{{ sb.bg }}"></span>
      </sc-for>
    </div>
    <span style="flex:none;font-size:11.5px;color:#6E7D8F;white-space:nowrap">{{ meta }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:398,&quot;height&quot;:60},&quot;stepLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Exploración emocional&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Paso 2 de 5 · quedan 10 min&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bars&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{bg:string,aria?:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      stepLabel: p.stepLabel ?? 'Exploración emocional',
      meta: p.meta ?? 'Paso 2 de 5 · quedan 10 min',
      bars: p.bars ?? [{ bg: '#9FD6C8' }, { bg: '#3D8C7C' }, { bg: '#E4EBE8' }, { bg: '#E4EBE8' }, { bg: '#E4EBE8' }]
    };
  }
}
</script>
</body>
</html>
